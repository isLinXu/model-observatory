name: Sync Hugging Face & deploy Pages

# Every `uses:` below is pinned to a full commit sha, with the tag it came from in
# a trailing comment. This job runs with `contents: write` on a schedule and pushes
# to main, so a tag moved upstream is code running here that nobody reviewed.
# Dependabot (.github/dependabot.yml) opens the bump PRs; nothing here auto-merges.

on:
  push:
    branches: [main]
  schedule:
    # Once per UTC day; GitHub may delay scheduled runs.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gatilin-hf-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout@v6
        with:
          persist-credentials: true
          ref: main

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install collector dependency
        id: install_deps
        run: python -m pip install -r requirements.txt

      # Regression gate: the collectors are network-facing code, so every
      # change ships only after the offline suite passes.
      - name: Run offline test suite
        id: offline_tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -v
          node --test tests/test_frontend.js

      - name: Capture all public model downloads
        id: capture_hf
        env:
          HF_AUTHOR: gatilin
        run: python scripts/collect.py --author "$HF_AUTHOR"

      - name: Capture public academic profile
        id: capture_scholar
        continue-on-error: true
        env:
          SCHOLAR_USER_ID: oTYM_I8AAAAJ
        run: python scripts/collect_scholar.py --user "$SCHOLAR_USER_ID"

      - name: Capture social platform followers
        id: capture_social
        continue-on-error: true
        env:
          # Optional: platforms that require a logged-in session read these.
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          XIAOHONGSHU_COOKIE: ${{ secrets.XIAOHONGSHU_COOKIE }}
        run: python scripts/collect_social.py --config config/social_sources.json

      - name: Capture GitHub account and repositories
        id: capture_github
        continue-on-error: true
        env:
          GITHUB_LOGIN: isLinXu
          # Optional: unlocks GitHub Projects (read:project) and raises the
          # anonymous REST rate limit. Without it the board still works.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_github.py --login "$GITHUB_LOGIN"

      - name: Capture anonymous public ModelScope models
        id: capture_modelscope
        continue-on-error: true
        run: python scripts/collect_modelscope.py --author isLinXu

      # One request per 100 starred repositories, so this crawl needs the
      # repository token: the anonymous budget is 60 requests per hour and the
      # GitHub collector above already spends part of it in the same run.
      # Without a token the collector publishes an "unavailable" snapshot.
      - name: Capture starred repository graph
        id: capture_stars
        continue-on-error: true
        env:
          GITHUB_LOGIN: isLinXu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_starred.py --login "$GITHUB_LOGIN" --data-dir data

      # The star detail file is fetched lazily by the wall and is also kept in
      # git history, so growth is reported instead of silently accepted.
      - name: Report star snapshot sizes
        shell: bash
        run: |
          for name in stars stars_repos stars_history; do
            file="data/${name}.json"
            if [ -f "$file" ]; then
              echo "${name}: $(wc -c <"$file") bytes"
            fi
          done
          if [ -f data/stars.json ] && [ "$(wc -c <data/stars.json)" -gt 153600 ]; then
            echo "::warning::data/stars.json is over 150 KB; review the cluster budgets in scripts/collect_starred.py"
          fi
          if [ -f data/stars_repos.json ] && [ "$(wc -c <data/stars_repos.json)" -gt 3145728 ]; then
            echo "::warning::data/stars_repos.json is over 3 MB; the star wall needs paging or a slimmer row"
          fi

      # The conference feed is third-party data: a downtime or format change
      # must not block the download boards. The collector keeps the last good
      # snapshot and marks it stale, so failures stay visible on the site.
      - name: Capture conference deadline feed
        id: capture_conferences
        continue-on-error: true
        run: python scripts/collect_conferences.py --data-dir data

      # Six public research lists are read over raw.githubusercontent, plus one
      # small commits query per list to learn when that file last changed. They
      # are third-party content in other people's repositories: a list that
      # cannot be read keeps its last good row and is published as stale, so
      # this step must never block the boards above or the indexes below.
      - name: Capture the tracked awesome lists
        id: capture_awesome
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_awesome.py --data-dir data

      # The id ledger is the only part that grows with other people's listings,
      # so its size is reported instead of silently accepted. The collector never
      # fails the pipeline over somebody else's repository, which means a run that
      # quietly read three of six lists would otherwise only be visible to whoever
      # opens the page. These warnings are the side channel: same facts, same words.
      - name: Report list tracking sizes
        shell: bash
        run: |
          for name in awesome awesome_ledger awesome_history; do
            file="data/${name}.json"
            if [ -f "$file" ]; then
              echo "${name}: $(wc -c <"$file") bytes"
            fi
          done
          if [ -f data/awesome.json ] && [ "$(wc -c <data/awesome.json)" -gt 122880 ]; then
            echo "::warning::data/awesome.json is over 120 KB even after the collector cut samples; the run's warnings say how far - lower SAMPLE_LIMIT, or stop tracking a list"
          fi
          if [ -f data/awesome_ledger.json ] && [ "$(wc -c <data/awesome_ledger.json)" -gt 204800 ]; then
            echo "::warning::data/awesome_ledger.json is over 200 KB; remembered ids are what grew - lower LEDGER_ID_LIMIT and the diff becomes an explicit lower bound"
          fi
          python - <<'PY'
          import json, pathlib

          def warn(message):
              print(f"::warning::{message}")

          index = pathlib.Path("data/awesome.json")
          if not index.exists():
              warn("data/awesome.json is missing: the list-tracking board has nothing to publish")
          else:
              payload = json.loads(index.read_text(encoding="utf-8"))
              summary = payload.get("summary") or {}
              status = payload.get("status")
              if status != "ok":
                  warn(f"list tracking status is {status}: {summary.get('repos_ok', 0)} of "
                       f"{summary.get('repos', 0)} lists read today; the rest carry their last "
                       f"snapshot and are labelled 沿用上次 / 本次未读取")
              rows = payload.get("repos") or []
              for row in rows:
                  if row.get("not_attempted"):
                      warn(f"{row.get('id')}: this run never fetched it (fetch budget or --only); "
                           f"its numbers are carried and last_attempt_at did not move")
                  elif row.get("status") not in (None, "ok"):
                      warn(f"{row.get('id')}: status {row.get('status')} - {row.get('error') or 'no reason given'}")
              capped = [row.get("id") for row in rows
                        if (row.get("measured") or {}).get("byte_capped")]
              if capped:
                  warn(f"{', '.join(capped)}: a file was cut at MAX_BYTES, so measured entries are a "
                       f"lower bound - raise MAX_BYTES or stop tracking that file")
              fetches = payload.get("fetches") or {}
              used, limit = fetches.get("files"), fetches.get("max_files")
              if fetches.get("budget_hit"):
                  warn(f"the run spent all {limit} fetches and did not reach every tracked list")
              elif isinstance(used, int) and isinstance(limit, int) and used >= 0.8 * limit:
                  warn(f"{used} of {limit} fetches used: within 20% of MAX_FETCHES, "
                       f"another source or a growing file count will start skipping lists")
              sizes = payload.get("sizes") or {}
              for key, label in (("payload_bytes", "data/awesome.json"),
                                 ("ledger_bytes", "data/awesome_ledger.json")):
                  value = sizes.get(key)
                  budget = sizes.get(f"{key[:-6]}_budget_bytes")
                  if isinstance(value, int) and isinstance(budget, int) and value >= 0.8 * budget:
                      warn(f"{label} is at {value // 1024} KB of a {budget // 1024} KB budget; "
                           f"check the run's warnings before the next list is added")
              baselines = [row.get("id") for row in rows if (row.get("diff") or {}).get("baseline")]
              if baselines:
                  warn(f"{len(baselines)} lists are still building a baseline "
                       f"({', '.join(baselines)}): their added/removed is not a change yet")
          PY

      # The template library is read from the working tree, so this step never
      # fails because of the network. A missing templates/ directory is
      # reported in the payload while the previous index is preserved.
      - name: Index the skill and prompt library
        id: index_templates
        run: python scripts/collect_templates.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"

      # The entity registry is read from the working tree and cross-checked
      # against the snapshots written above, so it stays last among the
      # collectors. It needs no network and no token: a structural error in an
      # entry has already failed the offline suite, and a target that moved is
      # published as a broken link rather than hiding the run.
      - name: Index the entity registry
        id: index_entities
        run: python scripts/collect_entities.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"

      - name: Report entity registry size
        shell: bash
        run: |
          if [ -f data/entities.json ]; then
            echo "entities: $(wc -c <data/entities.json) bytes"
          fi
          if [ -f data/entities.json ] && [ "$(wc -c <data/entities.json)" -gt 204800 ]; then
            echo "::warning::data/entities.json is over 200 KB; the board loads it eagerly - keep entries to relationships and move long prose to the Markdown source"
          fi

      # The task board is read from the working tree and cross-checked against
      # the registry and the conference index written above, so it runs last.
      # Like the registry it needs no network and no token; a card that points
      # at a research object which is gone is published as a broken reference,
      # while a missing sibling index leaves it unverified.
      - name: Index the task board
        id: index_tasks
        run: python scripts/collect_tasks.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"

      - name: Report task board size
        shell: bash
        run: |
          if [ -f data/tasks.json ]; then
            echo "tasks: $(wc -c <data/tasks.json) bytes"
          fi
          if [ -f data/tasks.json ] && [ "$(wc -c <data/tasks.json)" -gt 122880 ]; then
            echo "::warning::data/tasks.json is over 120 KB; the canvas fetches the whole board to draw edges - keep cards to structure and acceptance notes, and move long prose to the Markdown source"
          fi

      # The run reports its own health, before the commit that publishes it.
      # `!cancelled()` so the run most worth recording - the one that died on a
      # hard failure - still writes its line. Build and deploy come after this
      # commit, so this record does not claim to know how they went.
      - name: Record this run
        if: ${{ !cancelled() }}
        env:
          MO_JOB_STATUS: ${{ job.status }}
          MO_STEPS_JSON: ${{ toJSON(steps) }}
        run: python scripts/record_run.py

      - name: Commit historical snapshots
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Optional collectors may be missing on the first run, so stage only
          # the files that exist; the build treats the same files as optional.
          for snapshot in latest history scholar scholar_history social social_history \
                          github github_history templates templates_history \
                          modelscope modelscope_history conferences \
                          stars stars_repos stars_history \
                          entities entities_history tasks tasks_history \
                          awesome awesome_history awesome_ledger runs; do
            [ -f "data/${snapshot}.json" ] && git add "data/${snapshot}.json"
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: update Hugging Face downloads [skip ci]"
            # A user may push templates while the run is in flight, so the
            # first push can be rejected. Rebase once and retry before failing.
            if ! git push origin HEAD:main; then
              echo "Push rejected, rebasing onto the remote branch."
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          else
            echo 'Snapshots are unchanged.'
          fi

      - name: Build static website
        run: python scripts/build.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4
