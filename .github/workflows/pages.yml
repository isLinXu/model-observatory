name: Sync Hugging Face & deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Once per UTC day; GitHub may delay scheduled runs.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gatilin-hf-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install collector dependency
        run: python -m pip install -r requirements.txt

      # Regression gate: the collectors are network-facing code, so every
      # change ships only after the offline suite passes.
      - name: Run offline test suite
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -v
          node --test tests/test_frontend.js

      - name: Capture all public model downloads
        env:
          HF_AUTHOR: gatilin
        run: python scripts/collect.py --author "$HF_AUTHOR"

      - name: Capture public academic profile
        continue-on-error: true
        env:
          SCHOLAR_USER_ID: oTYM_I8AAAAJ
        run: python scripts/collect_scholar.py --user "$SCHOLAR_USER_ID"

      - name: Capture social platform followers
        continue-on-error: true
        env:
          # Optional: platforms that require a logged-in session read these.
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
          XIAOHONGSHU_COOKIE: ${{ secrets.XIAOHONGSHU_COOKIE }}
        run: python scripts/collect_social.py --config config/social_sources.json

      - name: Capture GitHub account and repositories
        continue-on-error: true
        env:
          GITHUB_LOGIN: isLinXu
          # Optional: unlocks GitHub Projects (read:project) and raises the
          # anonymous REST rate limit. Without it the board still works.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_github.py --login "$GITHUB_LOGIN"

      - name: Capture anonymous public ModelScope models
        continue-on-error: true
        run: python scripts/collect_modelscope.py --author isLinXu

      # One request per 100 starred repositories, so this crawl needs the
      # repository token: the anonymous budget is 60 requests per hour and the
      # GitHub collector above already spends part of it in the same run.
      # Without a token the collector publishes an "unavailable" snapshot.
      - name: Capture starred repository graph
        continue-on-error: true
        env:
          GITHUB_LOGIN: isLinXu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_starred.py --login "$GITHUB_LOGIN" --data-dir data

      # The star detail file is fetched lazily by the wall and is also kept in
      # git history, so growth is reported instead of silently accepted.
      - name: Report star snapshot sizes
        shell: bash
        run: |
          for name in stars stars_repos stars_history; do
            file="data/${name}.json"
            if [ -f "$file" ]; then
              echo "${name}: $(wc -c <"$file") bytes"
            fi
          done
          if [ -f data/stars.json ] && [ "$(wc -c <data/stars.json)" -gt 153600 ]; then
            echo "::warning::data/stars.json is over 150 KB; review the cluster budgets in scripts/collect_starred.py"
          fi
          if [ -f data/stars_repos.json ] && [ "$(wc -c <data/stars_repos.json)" -gt 3145728 ]; then
            echo "::warning::data/stars_repos.json is over 3 MB; the star wall needs paging or a slimmer row"
          fi

      # The conference feed is third-party data: a downtime or format change
      # must not block the download boards. The collector keeps the last good
      # snapshot and marks it stale, so failures stay visible on the site.
      - name: Capture conference deadline feed
        continue-on-error: true
        run: python scripts/collect_conferences.py --data-dir data

      # The template library is read from the working tree, so this step never
      # fails because of the network. A missing templates/ directory is
      # reported in the payload while the previous index is preserved.
      - name: Index the skill and prompt library
        run: python scripts/collect_templates.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"

      - name: Commit historical snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Optional collectors may be missing on the first run, so stage only
          # the files that exist; the build treats the same files as optional.
          for snapshot in latest history scholar scholar_history social social_history \
                          github github_history templates templates_history \
                          modelscope modelscope_history conferences \
                          stars stars_repos stars_history; do
            [ -f "data/${snapshot}.json" ] && git add "data/${snapshot}.json"
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: update Hugging Face downloads [skip ci]"
            # A user may push templates while the run is in flight, so the
            # first push can be rejected. Rebase once and retry before failing.
            if ! git push origin HEAD:main; then
              echo "Push rejected, rebasing onto the remote branch."
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          else
            echo 'Snapshots are unchanged.'
          fi

      - name: Build static website
        run: python scripts/build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
