name: Sync Hugging Face & deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Once per UTC day; GitHub may delay scheduled runs.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gatilin-hf-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install collector dependency
        run: python -m pip install -r requirements.txt

      - name: Capture all public model downloads
        env:
          HF_AUTHOR: gatilin
        run: python scripts/collect.py --author "$HF_AUTHOR"

      - name: Capture public academic profile
        continue-on-error: true
        env:
          SCHOLAR_USER_ID: oTYM_I8AAAAJ
        run: python scripts/collect_scholar.py --user "$SCHOLAR_USER_ID"

      - name: Commit historical snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json data/scholar.json data/scholar_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update Hugging Face downloads [skip ci]"
            git push origin HEAD:main
          else
            echo 'Snapshots are unchanged.'
          fi

      - name: Build static website
        run: python scripts/build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
